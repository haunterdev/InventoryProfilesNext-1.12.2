plugins {
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.1'
}

version = project.mod_version
group = project.mod_group
archivesBaseName = project.mod_id

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
    }
}

minecraft {
    mcVersion = '1.12.2'
    mcpMappingChannel = 'stable'
    mcpMappingVersion = '39'

    extraRunJvmArguments.addAll(
        '-ea:com.xy.ipn'
    )
}

repositories {
    maven {
        // JEI API (compile-only soft dependency, for the GUI exclusion handler)
        url 'https://maven.blamejared.com'
    }
}

dependencies {
    // Compile against the JEI API only; JEI is an optional runtime dependency.
    // The @JEIPlugin class is loaded by JEI's annotation scan and stays dormant
    // when JEI is absent.
    compileOnly 'mezz.jei:jei_1.12.2:4.16.1.1013:api'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.12.2'

    filesMatching('mcmod.info') {
        expand 'version': project.version, 'mcversion': '1.12.2'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
